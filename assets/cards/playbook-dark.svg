<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="t d">
<title id="t">PLAYBOOK &#8212; solo hackathon build</title>
<desc id="d">PLAYBOOK, solo hackathon build, repository sham-2510/playbook: a deterministic SOAR layer that intercepts, judges and contains rogue AI agents. Pipeline: DETECT under 2 ms &#8594; JUDGE under 5 ms &#8594; ENFORCE under 1 ms (verdicts ALLOW, DENY, QUARANTINE, ESCALATE) &#8594; FORENSICS async. End-to-end p95 &lt; 40 ms &#183; zero LLM calls in the judge path; NIST SP 800-53 policy builder; EU AI Act &#183; NIST AI RMF &#183; SOC 2 &#183; HIPAA &#183; GDPR mapping; Tamper-evident forensics: SHA-256 manifests + HMAC. Stack: Python, FastAPI, React, TypeScript, PostgreSQL.</desc>
