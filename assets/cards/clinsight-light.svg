<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="t d">
<title id="t">ClinSight &#8212; solo hackathon build</title>
<desc id="d">ClinSight, solo hackathon build, repository sham-2510/ClinSight: hierarchical multimodal clinical intelligence for emergency decision support. Pipeline: Coordinator &#8594; Radiologist &#8594; Lab Analyst &#8594; Safety &#8594; Documenter. 5 parent agents &#8594; 7 subagents &#8594; 12 reasoning nodes (LangGraph); Qwen2.5-VL-7B + Qwen3.5-35B-A3B at FP16 on AMD MI300X; 50/50 cases on a live benchmark &#183; mean latency 23.02 s. Stack: Python, LangGraph, vLLM, FastAPI, React, ROCm.</desc>
<defs><linearGradient id="ac" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0F9D8A"/><stop offset="100%" stop-color="#0969DA"/></linearGradient><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0969DA"/><stop offset="55%" stop-color="#8250DF"/><stop offset="100%" stop-color="#0F9D8A"/></linearGradient></defs>
