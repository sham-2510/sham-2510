<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Inside the AI clinical scribe</title>
<desc id="d">Architecture of the AI clinical scribe, simplified. 1: the Blazor WebAssembly app inside the fertility EMR (WebView2) calls Azure API Management over HTTPS. 2: API Management forwards to the speech token service on ASP.NET Core 8 (Azure App Service). 3: the service returns a short-lived token, so no keys reach the browser. 4: the app streams audio to Azure AI Speech for live transcription. 5: the transcript goes to the note orchestrator. 6: the orchestrator and Azure OpenAI draft a structured note. 7: the draft is encrypted with X.509 certificates (PHI encryption), reviewed by the clinician and saved to the chart. Azure Key Vault holds the secrets and certificates for the token service and PHI encryption.</desc>
